{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
  <h2>Înregistrare cont nou</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Înregistrează-te</button>
  </form>
  <p class="mt-3">Ai deja un cont? <a href="{% url 'login' %}">Autentifică-te</a></p>
</div>
{% endblock %}
