<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8" />
    <title>{% block title %}Travel AI{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'recommendation_list' %}">Travel AI</a>
            <div>
                {% if user.is_authenticated %}
                    <span class="me-3">Salut, {{ user.username }}!</span>
                    <form method="POST" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit">Logout</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-outline-primary btn-sm">Login</a>
                {% endif %}
                {% if user.is_authenticated %}
                    <a href="{% url 'edit_profile' %}">Edit Profile</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    {% block extra_scripts %}
    {% endblock %}
</body>
</html>
